<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能仿写平台</title>
<style>
  :root {
    --bg: #f7f8fa; --card: #ffffff; --line: #e5e7eb; --text: #1f2329;
    --muted: #6b7280; --primary: #2563eb; --primary-d: #1d4ed8; --ok: #16a34a; --warn: #d97706; --run: #2563eb;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.55; }

  .wrap { height: 100%; max-width: 1200px; margin: 0 auto; padding: 14px 16px;
    display: flex; flex-direction: column; }
  .layout { flex: 1; min-height: 0; display: flex; gap: 14px; }

  .col-left { flex: 0 0 320px; max-width: 320px; overflow-y: auto; padding-right: 2px; }
  .col-right { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 14px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px; margin-bottom: 14px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 10px 0 5px; }
  label:first-child { margin-top: 0; }
  input, select, textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line);
    border-radius: 8px; font-size: 14px; font-family: inherit; background: #fff; color: var(--text); }
  textarea { resize: none; }
  .err { color: #dc2626; font-size: 13px; margin-top: 8px; }
  .warn { color: var(--warn); font-size: 13px; margin-top: 8px; background: #fffbeb;
    border: 1px solid #fde68a; border-radius: 8px; padding: 9px 11px; line-height: 1.5; }
  .warn.highlight { border-color: var(--warn); box-shadow: 0 0 0 2px rgba(217,119,6,.18); }
  .hidden { display: none; }
  .tag { display: inline-block; background: #eef2ff; color: var(--primary); font-size: 12px;
    padding: 2px 8px; border-radius: 999px; margin: 0 6px 6px 0; }

  .btn { background: var(--primary); color: #fff; border: none; padding: 10px 16px;
    border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .btn:hover { background: var(--primary-d); }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn.ghost { background: #fff; color: var(--primary); border: 1px solid var(--primary); }
  .btn.small { padding: 6px 12px; font-size: 13px; }
  .btn.block { width: 100%; }

  /* 说明：悬浮提示的小图标 */
  .info { display: inline-flex; align-items: center; justify-content: center;
    width: 15px; height: 15px; margin-left: 5px; border-radius: 50%;
    background: var(--muted); color: #fff; font-size: 10px; font-weight: 700;
    cursor: help; vertical-align: middle; }

  /* 字数步进器：减、框、加（一行、紧凑） */
  .stepper { display: flex; align-items: stretch; gap: 6px; max-width: 200px; }
  .stepper button { width: 40px; flex: none; border: 1px solid var(--line); background: #fff;
    color: var(--text); border-radius: 8px; font-size: 18px; line-height: 1; font-weight: 700; cursor: pointer; }
  .stepper button:hover { border-color: var(--primary); color: var(--primary); }
  .stepper button:active { background: #eef2ff; }
  .stepper input { text-align: center; font-weight: 600; -moz-appearance: textfield; }
  .stepper input::-webkit-outer-spin-button,
  .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  /* 设置折叠面板 */
  #settingsPanel { border-top: 1px dashed var(--line); margin-top: 12px; padding-top: 4px; }

  /* 右侧：结果填满，内部滚动 */
  .card.result { flex: 1; min-height: 0; margin-bottom: 0; display: flex; flex-direction: column; }
  .result-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .result-head .title { font-size: 15px; font-weight: 700; }
  .result-head .tools { display: flex; gap: 8px; }
  #resultTags { margin-bottom: 4px; }
  .out { flex: 1; min-height: 0; white-space: pre-wrap; overflow-y: auto;
    background: #fff; font-size: 15px; line-height: 1.85; padding: 12px; }
  .live-tag { font-size: 11px; color: var(--run); margin-left: 6px; }

  /* 创作过程时间线 */
  .card.proc { flex: 0 0 auto; max-height: 38%; display: flex; flex-direction: column; min-height: 0; }
  .proc-head { display: flex; align-items: center; justify-content: space-between; }
  .proc-head .title { font-size: 14px; font-weight: 700; }
  .proc-head .count { font-size: 12px; color: var(--muted); }
  .step { display: flex; gap: 12px; padding: 8px 0; position: relative; }
  .step:not(:last-child)::before {
    content: ""; position: absolute; left: 9px; top: 26px; bottom: -2px; width: 2px; background: var(--line);
  }
  .dot { flex: 0 0 20px; width: 20px; height: 20px; border-radius: 50%; margin-top: 2px;
    background: #fff; border: 2px solid var(--line); position: relative; z-index: 1; }
  .dot.running { border-color: var(--run); background: var(--run); animation: pulse 1s infinite; }
  .dot.done { border-color: var(--ok); background: var(--ok); }
  .dot.warn { border-color: var(--warn); background: var(--warn); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(37,99,235,.45);} 70%{ box-shadow: 0 0 0 7px rgba(37,99,235,0);} 100%{box-shadow:0 0 0 0 rgba(37,99,235,0);} }
  .step-label { font-size: 14px; font-weight: 600; }
  .step-detail { font-size: 12.5px; color: var(--muted); margin-top: 2px; word-break: break-all; }
  .step.running .step-label::after { content: " …"; color: var(--run); }
  .step-meta { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .proc-body { flex: 1; min-height: 0; overflow-y: auto; margin-top: 6px; }

  @media (max-width: 820px) {
    body { overflow: auto; }
    .layout { flex-direction: column; }
    .col-left, .col-right { flex: none; max-width: none; width: 100%; overflow: visible; }
    .card.result { min-height: 50vh; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="layout">
    <!-- 左：配置 -->
    <div class="col-left">
      <div class="card">
        <label>题目 / 主题 / 素材</label>
        <textarea id="topic" rows="3" placeholder="短题目（≤20字）如：时间公平的流过每个人；或粘贴一篇小作文/草稿，系统会自动提炼关键点扩写转写"></textarea>

        <label>输入类型（自动识别 · 可手动覆盖）<span class="info" title="系统按字数/断句自动判断：短题目就发散成文，整篇小作文就先提炼关键点再扩写或转写。拿不准可手动指定。">i</span></label>
        <select id="inputMode">
          <option value="auto">自动识别（≤20字当题目发散，长文当素材扩写）</option>
          <option value="title">题目（发散模式）</option>
          <option value="essay">素材（提炼→扩写/转写）</option>
        </select>

        <label>写作技能<span class="info" title="留「自动路由」时按题目关键词匹配最合适的 magazine-writing-* 技能；也可手动指定下面任一个。">i</span></label>
        <select id="skill"><option value="auto">自动路由（按题目判断体裁）</option></select>

        <label>目标字数</label>
        <div class="stepper">
          <button type="button" id="len-">−</button>
          <input id="length" type="number" value="2000" min="300" max="6000" step="100" />
          <button type="button" id="len+">+</button>
        </div>

        <button class="btn ghost small" id="toggleSettings" type="button" style="margin-top:12px;">⚙ 设置</button>

        <div id="settingsPanel" class="hidden">
          <label>DeepSeek API Key<span class="info" title="仅保存在你浏览器本地（localStorage），不会上传到任何第三方；每次请求直接发给 DeepSeek。">i</span></label>
          <input id="apiKey" type="password" placeholder="sk-..." autocomplete="off" />

          <label>代理地址（可选 · 仅用于访问远程向量库）<span class="info" title="仅用于调用远程语料库 magazine-api（workers.dev）。若提示「语料库检索失败/网络不可达」，填写本地代理后重试即可；范文只是增强项，不填也能生成。">i</span></label>
          <input id="proxy" placeholder="如 http://127.0.0.1:7897，留空则直连" autocomplete="off" />
        </div>

        <button class="btn block" id="gen" style="margin-top:14px;">生成文章</button>
        <button class="btn ghost block hidden" id="stop" style="margin-top:8px;">停止</button>
        <div class="err hidden" id="err"></div>
        <div class="warn hidden" id="warn"></div>
      </div>
    </div>

    <!-- 右：结果 + 创作过程 -->
    <div class="col-right">
      <div class="card result">
        <div class="result-head">
          <div class="title">生成结果<span class="live-tag hidden" id="liveTag">● 实时生成中…</span></div>
          <div class="tools">
            <button class="btn ghost small" id="copy">复制全文</button>
            <button class="btn ghost small" id="download">下载 .md</button>
          </div>
        </div>
        <div id="resultTags"></div>
        <textarea id="out" class="out" readonly placeholder="生成的内容会显示在这里。文字超长时，本框内滚动查看。"></textarea>
      </div>

      <div class="card proc hidden" id="procCard">
        <div class="proc-head">
          <div class="title">创作过程</div>
          <div class="count" id="procCount"></div>
        </div>
        <div class="proc-body">
          <div id="steps"></div>
          <div class="step-meta hidden" id="workload"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!--SKILLS_JSON-->
<script>
const $ = (id) => document.getElementById(id);
let reader = null, aborted = false;

// 载入技能列表：优先读后端注入的数据，失败再回退到 /api/skills
(function loadSkills() {
  let list = null;
  try {
    const raw = document.getElementById('skills-data')?.textContent;
    if (raw) list = JSON.parse(raw);
  } catch (e) {}
  const apply = (arr) => {
    const sel = $('skill');
    (arr || []).forEach(s => {
      const o = document.createElement('option');
      o.value = s.id;
      o.textContent = s.name;
      if (s.description) o.title = s.description;
      sel.appendChild(o);
    });
  };
  if (list) apply(list);
  else fetch('/api/skills').then(r => r.json()).then(apply).catch(() => {});
})();

// 还原 Key / 代理
const savedKey = localStorage.getItem('deepseek_key');
if (savedKey) $('apiKey').value = savedKey;
const savedProxy = localStorage.getItem('magazine_proxy');
if (savedProxy) $('proxy').value = savedProxy;

// 设置面板开合
$('toggleSettings').onclick = () => $('settingsPanel').classList.toggle('hidden');

const STEP_LABELS = {
  1: '意图分析', 2: '选择写作技能', 3: '检索语料库范文',
  4: '组装提示词', 5: '调用 DeepSeek 生成', 6: '完成'
};

function renderStep(n, status, detail) {
  const stepsEl = $('steps');
  let row = $('step-' + n);
  if (!row) {
    row = document.createElement('div');
    row.id = 'step-' + n;
    row.className = 'step';
    row.innerHTML = `<span class="dot"></span><div class="step-body">
      <div class="step-label">第${n}步 · ${STEP_LABELS[n] || ''}</div>
      <div class="step-detail"></div></div>`;
    stepsEl.appendChild(row);
  }
  row.className = 'step ' + (status || '');
  const dot = row.querySelector('.dot');
  dot.className = 'dot ' + (status || '');
  row.querySelector('.step-detail').textContent = detail || '';
}

function showWorkload(d) {
  const el = $('workload');
  const items = [];
  items.push(`<span class="tag">技能：${d.skill_name}</span>`);
  items.push(`<span class="tag">${d.auto_picked ? '自动路由' : '手动指定'}</span>`);
  if (d.matched_keywords && d.matched_keywords.length && d.matched_keywords[0] !== '(默认)')
    items.push(`<span class="tag">命中：${d.matched_keywords.join('、')}</span>`);
  items.push(`<span class="tag">范文 ${d.references.length} 篇</span>`);
  items.push(`<span class="tag">成稿约 ${d.char_count} 字</span>`);
  if (d.input_mode_label) items.push(`<span class="tag">输入：${d.input_mode_label}</span>`);
  el.innerHTML = items.join('');
  el.classList.remove('hidden');
}

// 字数步进器：以百为步进，锁定 [300, 6000]
const LEN_MIN = 300, LEN_MAX = 6000, LEN_STEP = 100;
function bumpLen(delta) {
  const el = $('length');
  let v = parseInt(el.value, 10);
  if (!Number.isFinite(v)) v = 2000;
  v = Math.round((v + delta) / LEN_STEP) * LEN_STEP;
  v = Math.max(LEN_MIN, Math.min(LEN_MAX, v));
  el.value = v;
}
$('len-').onclick = () => bumpLen(-100);
$('len+').onclick = () => bumpLen(100);

$('gen').onclick = async () => {
  const topic = $('topic').value.trim();
  const apiKey = $('apiKey').value.trim();
  $('err').classList.add('hidden'); $('warn').classList.add('hidden');
  $('warn').classList.remove('highlight');
  if (!topic) { showErr('请填写题目'); return; }
  if (!apiKey) { showErr('请填写 DeepSeek API Key（点「⚙ 设置」填写）'); return; }
  localStorage.setItem('deepseek_key', apiKey);
  const proxy = $('proxy').value.trim();
  localStorage.setItem('magazine_proxy', proxy);
  const inputMode = $('inputMode').value;

  aborted = false;
  $('steps').innerHTML = ''; $('out').value = '';
  $('resultTags').innerHTML = ''; $('workload').classList.add('hidden');
  $('procCard').classList.remove('hidden');
  $('liveTag').classList.remove('hidden');
  $('gen').disabled = true; $('gen').textContent = '生成中…';
  $('stop').classList.remove('hidden');
  $('procCount').textContent = '准备中…';

  const body = JSON.stringify({
    topic, skill: $('skill').value, length: +$('length').value,
    apiKey, proxy, inputMode, top_k: 5
  });

  try {
    const res = await fetch('/api/generate', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body
    });
    if (!res.ok || !res.body) {
      const t = await res.text();
      showErr('请求失败：' + t);
      return finishGen();
    }
    reader = res.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buf = '', done = false;
    while (!aborted) {
      const { value, done: d } = await reader.read();
      if (d) { done = true; break; }
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf('\n\n')) !== -1) {
        const chunk = buf.slice(0, idx); buf = buf.slice(idx + 2);
        handleSSE(chunk);
      }
    }
    if (aborted) { $('procCount').textContent = '已停止'; }
  } catch (e) {
    showErr('网络错误：' + e.message);
  } finally {
    if (!aborted) finishGen();
  }
};

function handleSSE(chunk) {
  let ev = 'message', dataStr = '';
  chunk.split('\n').forEach(line => {
    if (line.startsWith('event:')) ev = line.slice(6).trim();
    else if (line.startsWith('data:')) dataStr = line.slice(5).trim();
  });
  let data; try { data = JSON.parse(dataStr); } catch { return; }

  if (ev === 'step') {
    renderStep(data.n, data.status, data.detail);
    updateCount();
  } else if (ev === 'token') {
    $('out').value += data.text;
    $('out').scrollTop = $('out').scrollHeight;
  } else if (ev === 'done') {
    $('out').value = data.article || $('out').value;
    showWorkload(data);
    $('liveTag').classList.add('hidden');
    const tags = [];
    tags.push(`<span class="tag">技能：${data.skill_name}</span>`);
    if (data.auto_picked) tags.push('<span class="tag">自动路由</span>');
    if (data.input_mode_label) tags.push(`<span class="tag">${data.input_mode_label}</span>`);
    (data.references || []).forEach(r => tags.push(`<span class="tag">范文 ${r.title}(#${r.id})</span>`));
    $('resultTags').innerHTML = tags.join('');
    if (data.warn) {
      $('warn').textContent = '⚠️ ' + data.warn;
      $('warn').classList.remove('hidden'); $('warn').classList.add('highlight');
      $('proxy').focus();
    }
    $('procCount').textContent = `完成 · 成稿约 ${data.char_count} 字`;
  } else if (ev === 'error') {
    showErr(data.message || '生成失败');
    $('liveTag').classList.add('hidden');
    $('procCount').textContent = '出错';
  }
}

function updateCount() {
  const rows = $('steps').querySelectorAll('.step').length;
  $('procCount').textContent = `进行中 · ${rows}/6 步`;
}

function finishGen() {
  $('gen').disabled = false; $('gen').textContent = '生成文章';
  $('stop').classList.add('hidden');
  if (!$('out').value) $('liveTag').classList.add('hidden');
}

$('stop').onclick = () => {
  aborted = true;
  if (reader) reader.cancel();
};

// 一键复制：优先用 Clipboard API，非安全上下文降级到 execCommand
function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text);
  }
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.top = '-9999px';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
  return Promise.resolve();
}

$('copy').onclick = () => {
  const txt = $('out').value;
  if (!txt) { showErr('还没有可复制的内容'); return; }
  copyText(txt).then(() => {
    const b = $('copy'), old = b.textContent;
    b.textContent = '已复制 ✓'; b.style.color = 'var(--ok)';
    setTimeout(() => { b.textContent = old; b.style.color = ''; }, 1500);
  }).catch(() => {
    showErr('复制失败，请手动选中正文后 Ctrl/Cmd+C');
  });
};
$('download').onclick = () => {
  const blob = new Blob([$('out').value], { type: 'text/markdown;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = ($('topic').value.trim() || 'article') + '.md';
  a.click();
};

function showErr(m) { $('err').textContent = m; $('err').classList.remove('hidden'); }
</script>
</body>
</html>
